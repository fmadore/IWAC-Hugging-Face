version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # spaCy 3.8 pins thinc<8.4 and srsly<3; a grouped bump past either
      # makes the whole lock uninstallable (PR #33). Lift these with spaCy 4.
      - dependency-name: "thinc"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "srsly"
        update-types: ["version-update:semver-major"]
