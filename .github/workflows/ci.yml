name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install static-check dependencies
        run: python -m pip install ruff

      - name: Compile every Python module
        run: python -m compileall -q . -x '(^|/)(\.venv|\.git|\.cache[^/]*)/'

      - name: Reject undefined names and dead imports
        # Rules are pinned in pyproject.toml ([tool.ruff.lint]): F821 catches a
        # refactor that drops an import used inside main() or a rare branch —
        # which the import-smoke tests cannot see — and F401 stops the dead
        # imports such a refactor leaves behind from accumulating. Deliberate
        # availability checks carry `# noqa: F401`, which ruff honours.
        run: ruff check --output-format=github .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage_artifact: true
          - os: ubuntu-latest
            python: "3.13"
            coverage_artifact: false
          - os: windows-latest
            python: "3.12"
            coverage_artifact: false
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit, contract, and import-smoke tests
        run: >-
          python -m pytest tests -q
          --cov=iwac_common
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=70

      - name: Upload coverage report
        if: matrix.coverage_artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
