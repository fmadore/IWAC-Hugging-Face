name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install static-check dependencies
        run: python -m pip install pyflakes

      - name: Compile every Python module
        run: python -m compileall -q . -x '(^|/)(\.venv|\.git|\.cache[^/]*)/'

      - name: Reject undefined names
        shell: bash
        run: |
          # Pyflakes exits non-zero for every diagnostic, including warnings
          # outside this focused gate. Capture its report first, then fail only
          # for the undefined-name errors this step is intended to reject.
          python -m pyflakes $(git ls-files '*.py') > pyflakes.log || true
          cat pyflakes.log
          if grep -qi "undefined name" pyflakes.log; then
            exit 1
          fi

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage_artifact: true
          - os: ubuntu-latest
            python: "3.13"
            coverage_artifact: false
          - os: windows-latest
            python: "3.12"
            coverage_artifact: false
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit, contract, and import-smoke tests
        run: >-
          python -m pytest tests -q
          --cov=iwac_common
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=70

      - name: Upload coverage report
        if: matrix.coverage_artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
