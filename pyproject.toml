# Runtime requirements are read from the same files used by pip and the lock.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iwac-hugging-face"
version = "1.0.1"
description = "Pipeline scripts for the Islam West Africa Collection dataset on Hugging Face Hub"
# 3.12 is the real floor, not a preference: the pinned numpy line (2.5, capped
# in requirements.txt) requires >= 3.12. Declaring >= 3.10 while shipping a
# dependency set that cannot install there is a promise the pipeline cannot
# keep. CI runs 3.12 for the same reason.
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]
readme = "README.md"
license = "MIT"

[tool.setuptools]
packages = [
  "iwac_common", "iwac_pipeline", "iwac_pipeline.uploads",
  "iwac_pipeline.uploads.articles", "iwac_pipeline.uploads.publications",
  "iwac_pipeline.uploads.documents", "iwac_pipeline.uploads.references",
  "iwac_pipeline.uploads.index", "iwac_pipeline.uploads.images",
  "iwac_pipeline.uploads.audiovisual", "iwac_pipeline.processing",
  "iwac_pipeline.processing.lda_topic_modeling", "iwac_pipeline.analyses",
  "iwac_pipeline.mirror",
]
py-modules = ["country_mapper", "lemmatize_update_hf"]

[tool.setuptools.package-dir]
"iwac_pipeline.uploads.articles" = "articles"
"iwac_pipeline.uploads.publications" = "islamic-publications"
"iwac_pipeline.uploads.documents" = "document"
"iwac_pipeline.uploads.references" = "reference"
"iwac_pipeline.uploads.index" = "index"
"iwac_pipeline.uploads.images" = "images"
"iwac_pipeline.uploads.audiovisual" = "audiovisual"
"iwac_pipeline.processing" = "post-processing"
"iwac_pipeline.processing.lda_topic_modeling" = "post-processing/lda_topic_modeling"
"iwac_pipeline.analyses" = "analyses"
"iwac_pipeline.mirror" = "data"

[tool.setuptools.package-data]
iwac_common = ["public_columns.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
nlp = {file = ["requirements-nlp.txt"]}
analysis = {file = ["requirements-analysis.txt"]}
all = {file = ["requirements-nlp.txt", "requirements-analysis.txt"]}
dev = {file = ["requirements-tools.txt"]}

[project.scripts]
iwac-upload = "iwac_pipeline.cli:upload_main"
iwac-mirror = "iwac_pipeline.cli:mirror_main"
iwac-publish-public = "iwac_pipeline.cli:publish_public_main"
iwac-process = "iwac_pipeline.cli:process_main"
iwac-analyze = "iwac_pipeline.cli:analyze_main"

[tool.ruff]
# Deliberately not a style gate. These two rules are the ones that catch
# breakage the import-smoke tests cannot: F821 for a name used inside main()
# or a rare branch after a refactor dropped its import, F401 for the imports
# such a refactor leaves behind. Unlike pyflakes, ruff honours `# noqa: F401`,
# which is what keeps deliberate availability checks (see
# calculate_hijri_dates.py) out of the report.
target-version = "py312"
exclude = [".venv", ".cache_omk*", "*.ipynb"]

[tool.ruff.lint]
select = ["F401", "F811", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "build/*", "dist/*", "*/site-packages/*", ".venv/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true
